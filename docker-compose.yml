# Local Postgres for the data pipeline — dev/prod parity with the deployed
# cloud Postgres (Cloud SQL / Neon). Pinned to 16, host port 5433 to avoid
# clashing with a brew postgresql@14 on 5432.
#
#   npm run db:pg:up     # start (detached)
#   npm run db:pg:down   # stop (keeps the volume)
#
# Connection: postgres://postgres:postgres@localhost:5433/electionsbg
# Override with DATABASE_URL. See docs/plans/postgres-migration-v1.md.
services:
  postgres:
    image: postgres:16
    container_name: electionsbg-pg
    # pg_stat_statements → query-level perf visibility (which /api/db queries
    # are actually slow). `CREATE EXTENSION pg_stat_statements` runs in
    # 000_search_fns.sql on every load.
    command: postgres -c shared_preload_libraries=pg_stat_statements
    # Docker's default /dev/shm is 64 MB, and Postgres puts every parallel
    # query's and parallel vacuum's dynamic-shared-memory segment there. That is
    # far too small for this repo's workload: `npm run test:data` runs ~16
    # concurrent vitest workers against corpora in the hundreds of thousands of
    # rows, so the planner goes parallel on many of them at once and they
    # exhaust it between them. Measured 2026-08-25 on the full suite — 2 tests
    # in official_companies.data.test.ts died with
    #   could not resize shared memory segment "/PostgreSQL.…" to 8388608 bytes:
    #   No space left on device
    # and both passed when the file was re-run alone. That is the trap: it looks
    # like a data defect, it is load-dependent, and it lands on whichever test
    # happened to be unlucky.
    #
    # tmpfs, so this is a CEILING and not an allocation — it consumes host RAM
    # only as Postgres actually uses it. 1 GB against a 24 GB host is generous
    # on purpose; the failure it prevents is expensive to diagnose and the cost
    # of headroom is zero until it is needed.
    shm_size: 1gb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: electionsbg
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d electionsbg"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
