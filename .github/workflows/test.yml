name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only one run per branch — newer pushes cancel older runs.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + build + playwright
    runs-on: ubuntu-latest
    # Was 25, and run 33036199067 finished in 23m39s — the browser tests now make
    # real cross-origin data fetches to the GCS bucket (see the Build step), so the
    # old ceiling had no headroom left.
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cache the Playwright browser binary so we don't re-download Chromium
      # (~150 MB) on every run. Key on the resolved @playwright/test version
      # so a runtime upgrade busts the cache automatically.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit path)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.18.0

      - name: Lint
        run: npm run lint

      # Hermetic — no browser, emulator or database — so it runs before the
      # expensive build and fails fast.
      - name: Unit tests
        run: npm run test:unit

      # The `functions/` package keeps its own node:test gate (it is CommonJS and
      # excluded from the root vitest projects), so `test:unit` does not cover it.
      # Without this step the route table, the registry engine and the /officials
      # redirect parser are tested only on a developer's machine.
      - name: Cloud Function tests
        run: npm run functions:test

      # The public evaluator has an isolated Node package plus a real
      # Hosting -> Function -> Firestore boundary gate. The latter uses a
      # demo-* project and guarded fake security adapters; it cannot reach
      # production services or load production secrets.
      - name: Install news evaluation Function dependencies
        run: npm --prefix news-functions ci

      - name: News evaluation Function tests
        run: npm run news:evals:test

      - name: News evaluation emulator integration
        run: npm run news:evals:test:emulator

      # The webServer config in playwright.config.ts boots `firebase
      # emulators:start --only hosting`, which serves dist/. So the dist
      # tree must exist before tests run.
      #
      # ⚠️ VITE_DATA_BASE_URL IS NOT OPTIONAL HERE, AND ITS ABSENCE FAILS AT 200.
      # `.env.production` is gitignored, so without this the build resolves an EMPTY
      # data origin and `dataUrl()` becomes the identity — every `data/**` fetch goes
      # same-origin, the emulator serves only dist/ (which never holds that tree, and
      # whose hosting `ignore` list drops `procurement/**/*.json` outright), so the
      # catch-all answers with the SPA SHELL. firebase.json's `**/*.json` header rule
      # then stamps it `application/json`, so the fetch looks successful right up to
      # JSON.parse — the query never resolves, and every hub KPI band renders
      # skeletons. Measured on run 33036199067: eight `hub head — the §3.0 height
      # budget` tests failed at 0 `data-kpi-cell`s while the HEIGHT assertion passed,
      # because a head that lost its band is comfortably inside its budget.
      #
      # The origin must also be in `scripts/bucket_cors.json` (127.0.0.1:5002 is the
      # Playwright baseURL) or the browser blocks it and the symptom is identical.
      - name: Build
        run: npm run build
        env:
          VITE_DATA_BASE_URL: https://storage.googleapis.com/data-electionsbg-com

      - name: Run Playwright tests
        run: npm test
        env:
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
